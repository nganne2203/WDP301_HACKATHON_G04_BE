name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --project b7d27a46-a347-4736-81a2-91b4b4c15f91 \
            --service d4de34df-72ae-4cb0-9a57-0ed19896b543 \
            --environment bfa1069a-f339-41ef-b8b9-f1da6db1ce37
