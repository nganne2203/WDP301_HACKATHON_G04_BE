  /api/github/webhooks:
    post:
      summary: Receive GitHub webhook deliveries
      description: |
        Internal ingestion endpoint for GitHub webhook deliveries.

        FE notes:
        - This endpoint is not designed for frontend use.
        - The response is intentionally fast because heavy processing continues in BullMQ worker jobs.
        - Delivery statuses move through `RECEIVED -> QUEUED -> PROCESSING -> PROCESSED` or `FAILED`.
      tags: [GitHub Webhooks]
      parameters:
        - in: header
          name: X-GitHub-Delivery
          required: true
          schema:
            type: string
        - in: header
          name: X-GitHub-Event
          required: true
          schema:
            type: string
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook accepted or safely ignored
        '403':
          description: Invalid signature

