tags:
  - name: Runtime
    description: |
      Runtime and health-check endpoints.

      FE notes:
      - `/health` is only a liveness probe.
      - `/ready` should be used by ops or deployment checks to confirm MongoDB and Redis are available.
  - name: GitHub
    description: |
      GitHub integration and repository provisioning flow.

      FE notes:
      - Configure organization credentials first.
      - Repository creation and webhook registration are separate concepts, even though creation tries to auto-register webhook.
      - Collaborator access and repository webhook status should be surfaced in the admin UI.
  - name: GitHub Webhooks
    description: |
      GitHub inbound webhook endpoint.

      FE notes:
      - This endpoint is for GitHub only, not for browser/frontend calls.
      - Delivery is designed to return quickly and continue processing asynchronously through Redis + worker.
  - name: Repositories
    description: |
      Internal repository tracking and repository evidence endpoints.

      FE notes:
      - List/detail endpoints are synchronous reads from MongoDB.
      - Sync/evidence endpoints usually queue background work and return immediately.
      - `webhookStatus` and `accessState` are key status fields for admin screens.
  - name: AI Reviews
    description: |
      AI-assisted technical audit endpoints.

      FE notes:
      - Trigger endpoints are asynchronous and usually return queue acknowledgment first.
      - Review data is advisory only and must not be treated as final judging scores.
  - name: Participants
    description: |
      Participant registration, event presence, and GitHub-access lifecycle.
  - name: Teams
    description: |
      Team lifecycle, invitations, placement, and capacity-related workflows.

      FE notes:
      - Invitation accept/decline endpoints are public token flows.
      - Placement/status updates are usually coordinator-only actions.
  - name: Submissions
    description: |
      Team submission records for demo, report, and presentation artifacts.
  - name: Rubrics
    description: |
      Rubrics and criteria used for human judging and AI-aware audit guidance.

      FE notes:
      - `judgeOnly=true` means the criterion is visible to human judges but should not drive AI auditing logic directly.
      - `aiInstruction` can be shown in admin tooling but usually does not belong in contestant-facing UI.
  - name: Rounds
    description: Competition round configuration and progression.
  - name: Judging Boards
    description: Judge-team grouping and board assignment endpoints.
  - name: Score Sheets
    description: Judge scoring data entry and submission flow.
  - name: Rankings
    description: Ranking generation based on judge score sheets only.
  - name: Finalists
    description: Finalist selection endpoints based on event competition configuration.
  - name: Results
    description: Official round result publication.
  - name: Audit Logs
    description: |
      Search and summary APIs for operational and business audit trails.

      FE notes:
      - Use list view for timeline tables.
      - Use summary view for admin dashboards and incident triage.
  - name: Operations
    description: |
      Coordinator-facing operational visibility endpoints for queue, webhook, and AI pipeline status.

      FE notes:
      - These endpoints are designed for admin dashboards, not contestant UI.
      - Redis outages may return degraded queue data instead of crashing the page.
  - name: Timelines
    description: Event schedule and timeline management endpoints.
  - name: Notifications
    description: Notification inbox endpoints for authenticated users.
  - name: Media
    description: User-side media upload and retrieval endpoints.
  - name: Admin Media
    description: Admin-side media moderation and storage configuration endpoints.

components:
  schemas:
    SuccessEnvelope:
      type: object
      description: Standard successful API envelope used by most backend endpoints.
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Get repositories successfully
        data:
          nullable: true
        pagination:
          nullable: true
    PaginatedMeta:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 4
        pageSize:
          type: integer
          example: 10
        totalItems:
          type: integer
          example: 37
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
    ReadyStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        checks:
          type: object
          properties:
            mongodb:
              type: string
              example: ready
            redis:
              type: string
              example: ready
        redisError:
          type: string
          nullable: true
    GitHubConfigRequest:
      type: object
      description: Save or update GitHub org-level configuration for a specific event.
      required: [eventId, organizationName, ownerUsername, enabled]
      properties:
        eventId:
          type: string
          example: 68452b1c4f9a72f84d8a1c10
        organizationName:
          type: string
          example: seal-org
        ownerUsername:
          type: string
          example: seal-admin
        githubToken:
          type: string
          nullable: true
        enabled:
          type: boolean
          example: true
    GitHubRepositoryCreateRequest:
      type: object
      description: Create a real GitHub repository in the configured organization.
      required: [eventId, repoName]
      properties:
        eventId:
          type: string
          example: 68452b1c4f9a72f84d8a1c10
        repoName:
          type: string
          example: team-alpha-project
        description:
          type: string
          nullable: true
        private:
          type: boolean
          default: true
        teamId:
          type: string
          nullable: true
        roundId:
          type: string
          nullable: true
    GitHubCollaboratorRequest:
      type: object
      required: [eventId]
      properties:
        eventId:
          type: string
        permission:
          type: string
          enum: [pull, triage, push, maintain, admin]
          default: push
    GitHubWebhookRegisterRequest:
      type: object
      required: [eventId]
      properties:
        eventId:
          type: string
    GitHubOrganizationInvitationRequest:
      type: object
      required: [eventId, email]
      properties:
        eventId:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [direct_member]
          default: direct_member
    GitHubRevokeMembersRequest:
      type: object
      required: [eventId, confirmationText]
      properties:
        eventId:
          type: string
        confirmationText:
          type: string
          enum: [REVOKE MEMBERS]
    Repository:
      type: object
      description: Internal repository tracking record used by repository sync, webhook, and audit features.
      properties:
        id:
          type: string
        eventId:
          type: string
        teamId:
          type: string
        roundId:
          type: string
          nullable: true
        githubOwner:
          type: string
        githubRepo:
          type: string
        repositoryFullName:
          type: string
        repositoryUrl:
          type: string
          format: uri
        defaultBranch:
          type: string
        latestCommitSha:
          type: string
          nullable: true
        lastProcessedCommitSha:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, ACTIVE, ARCHIVED, DISCONNECTED]
        accessState:
          type: string
          enum: [UNKNOWN, PENDING, GRANTED, REVOKED]
        accessGrantedAt:
          type: string
          format: date-time
          nullable: true
        accessRevokedAt:
          type: string
          format: date-time
          nullable: true
        webhookRegisteredAt:
          type: string
          format: date-time
          nullable: true
        webhookStatus:
          type: string
          enum: [NOT_CONFIGURED, PENDING, REGISTERED, FAILED]
          description: Current webhook registration lifecycle state for the GitHub repository.
        lastWebhookRegistrationError:
          type: string
          nullable: true
    RepositoryCreateRequest:
      type: object
      required: [eventId, teamId, githubOwner, githubRepo, repositoryUrl]
      properties:
        eventId:
          type: string
        teamId:
          type: string
        roundId:
          type: string
          nullable: true
        githubOwner:
          type: string
        githubRepo:
          type: string
        repositoryUrl:
          type: string
          format: uri
        defaultBranch:
          type: string
          default: main
        latestCommitSha:
          type: string
          nullable: true
        lastProcessedCommitSha:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, ACTIVE, ARCHIVED, DISCONNECTED]
        accessState:
          type: string
          enum: [UNKNOWN, PENDING, GRANTED, REVOKED]
    RepositoryUpdateRequest:
      type: object
      properties:
        roundId:
          type: string
          nullable: true
        defaultBranch:
          type: string
        latestCommitSha:
          type: string
          nullable: true
        lastProcessedCommitSha:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, ACTIVE, ARCHIVED, DISCONNECTED]
        accessState:
          type: string
          enum: [UNKNOWN, PENDING, GRANTED, REVOKED]
        repositoryUrl:
          type: string
          format: uri
        githubOwner:
          type: string
        githubRepo:
          type: string
    ParticipantRequest:
      type: object
      description: Create or update a participant registration record for an event.
      required: [eventId]
      properties:
        eventId:
          type: string
        userId:
          type: string
          nullable: true
        teamId:
          type: string
          nullable: true
        chapterName:
          type: string
          nullable: true
        teamRole:
          type: string
          enum: [MEMBER, LEADER]
        isGraduated:
          type: boolean
        consentMediaUse:
          type: boolean
        eligibilityStatus:
          type: string
          enum: [PENDING, ELIGIBLE, INELIGIBLE]
        attendedActivities:
          type: array
          items:
            type: string
        checkInStatus:
          type: string
          enum: [NOT_CHECKED_IN, CHECKED_IN]
        githubAccessStatus:
          type: string
          enum: [NOT_GRANTED, GRANTED, REVOKED]
        status:
          type: string
          enum: [INVITED, ACTIVE, WITHDRAWN]
    TeamCreateRequest:
      type: object
      description: Create a team and optionally seed invitation emails in the same request.
      required: [eventId, name]
      properties:
        eventId:
          type: string
        name:
          type: string
        trackId:
          type: string
          nullable: true
        chapterName:
          type: string
          nullable: true
        projectName:
          type: string
          nullable: true
        invitedEmails:
          type: array
          items:
            type: string
            format: email
        invitedMembers:
          type: array
          items:
            type: object
            properties:
              fullName:
                type: string
              email:
                type: string
                format: email
    TeamInviteMembersRequest:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
        members:
          type: array
          items:
            type: object
            properties:
              fullName:
                type: string
              email:
                type: string
                format: email
    TeamStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, WAITING_FOR_MEMBERS, WAITLISTED, CONFIRMED, REJECTED, ACTIVE, INACTIVE, DISQUALIFIED]
        trackId:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
    TeamPlacementRequest:
      type: object
      properties:
        trackId:
          type: string
          nullable: true
        trackAssignmentMethod:
          type: string
          enum: [DRAW, MANUAL, SYSTEM]
    SubmissionRequest:
      type: object
      description: Store or update a submission artifact set for a team in a round.
      required: [eventId, roundId, teamId]
      properties:
        eventId:
          type: string
        roundId:
          type: string
        teamId:
          type: string
        repositoryId:
          type: string
          nullable: true
        demoUrl:
          type: string
          format: uri
          nullable: true
        reportUrl:
          type: string
          format: uri
          nullable: true
        presentationUrl:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum: [DRAFT, SUBMITTED, ACCEPTED, REJECTED]
    SubmissionUpdateRequest:
      type: object
      description: Update draft submission artifacts before final submit.
      properties:
        repositoryId:
          type: string
          nullable: true
        demoUrl:
          type: string
          format: uri
          nullable: true
        reportUrl:
          type: string
          format: uri
          nullable: true
        presentationUrl:
          type: string
          format: uri
          nullable: true
    SubmissionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [DRAFT, SUBMITTED, ACCEPTED, REJECTED]
    RubricRequest:
      type: object
      description: Create a rubric that can later be linked to a round.
      required: [eventId, title]
      properties:
        eventId:
          type: string
        roundId:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        totalScore:
          type: number
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
    RubricUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
    CriterionRequest:
      type: object
      description: Add a criterion to a rubric, including AI-specific audit hints.
      required: [name, maxScore]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        maxScore:
          type: number
        weight:
          type: number
        order:
          type: integer
        judgeOnly:
          type: boolean
        aiSupportForAudit:
          type: boolean
        aiInstruction:
          type: string
          nullable: true
    CriterionUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        maxScore:
          type: number
        weight:
          type: number
        order:
          type: integer
        judgeOnly:
          type: boolean
        aiSupportForAudit:
          type: boolean
        aiInstruction:
          type: string
          nullable: true
    RoundRequest:
      type: object
      required: [eventId, name]
      properties:
        eventId:
          type: string
        trackId:
          type: string
          nullable: true
        name:
          type: string
        roundType:
          type: string
          enum: [PRELIMINARY, FINAL]
        assignedTeamIds:
          type: array
          items:
            type: string
        promotedTeamIds:
          type: array
          items:
            type: string
        maxPromotedTeams:
          type: integer
          nullable: true
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        submissionDeadline:
          type: string
          format: date-time
          nullable: true
        publishTime:
          type: string
          format: date-time
          nullable: true
        assignedJudgeIds:
          type: array
          items:
            type: string
        rubricId:
          type: string
          nullable: true
        promotionRule:
          type: string
          nullable: true
        tieBreakRule:
          type: string
          nullable: true
        tieBreakDurationMinutes:
          type: integer
          nullable: true
        status:
          type: string
          enum: [DRAFT, OPEN, CLOSED, SCORING, COMPLETED]
    JudgingBoardRequest:
      type: object
      required: [eventId, roundId, name, boardNumber]
      properties:
        eventId:
          type: string
        roundId:
          type: string
        trackId:
          type: string
          nullable: true
        name:
          type: string
        boardNumber:
          type: integer
        teamIds:
          type: array
          items:
            type: string
        judgeIds:
          type: array
          items:
            type: string
        maxTeams:
          type: integer
        status:
          type: string
          enum: [DRAFT, ASSIGNED, SCORING, COMPLETED]
    AutoAssignBoardsRequest:
      type: object
      required: [eventId, roundId]
      properties:
        eventId:
          type: string
        roundId:
          type: string
    ScoreItem:
      type: object
      required: [criterionId, scoreValue]
      properties:
        criterionId:
          type: string
        scoreValue:
          type: number
        comment:
          type: string
          nullable: true
    ScoreSheetRequest:
      type: object
      description: Create a judge score sheet for one team submission in one board/round.
      required: [eventId, roundId, boardId, teamId, submissionId]
      properties:
        eventId:
          type: string
        roundId:
          type: string
        boardId:
          type: string
        teamId:
          type: string
        submissionId:
          type: string
        rubricId:
          type: string
          nullable: true
        generalComment:
          type: string
          nullable: true
        scores:
          type: array
          items:
            $ref: '#/components/schemas/ScoreItem'
    ScoreSheetUpdateRequest:
      type: object
      properties:
        generalComment:
          type: string
          nullable: true
        scores:
          type: array
          items:
            $ref: '#/components/schemas/ScoreItem'
    GenerateRankingsRequest:
      type: object
      required: [eventId, roundId]
      properties:
        eventId:
          type: string
        roundId:
          type: string
        rankingType:
          type: string
          enum: [TEAM]
    SelectFinalistsRequest:
      type: object
      required: [eventId, roundId]
      properties:
        eventId:
          type: string
        roundId:
          type: string
    PublishResultsRequest:
      type: object
      required: [eventId, roundId]
      properties:
        eventId:
          type: string
        roundId:
          type: string
        repositoryAccessAction:
          type: string
          enum: [NONE, FREEZE, REVOKE]
          description: Optional repository lifecycle action applied to ranked teams after publication.
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditLogSummary:
      type: object
      properties:
        totalItems:
          type: integer
        actionBreakdown:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              count:
                type: integer
        resourceBreakdown:
          type: array
          items:
            type: object
            properties:
              resourceType:
                type: string
              count:
                type: integer
        recentAuditLogs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
    OperationsDashboardResponse:
      type: object
      properties:
        scope:
          type: object
          properties:
            eventId:
              type: string
              nullable: true
            roundId:
              type: string
              nullable: true
        metrics:
          type: object
          properties:
            participants:
              type: integer
            teams:
              type: integer
            submissions:
              type: integer
            repositories:
              type: integer
            pendingAiReviews:
              type: integer
            failedAiReviews:
              type: integer
            retryPendingAiReviews:
              type: integer
            manualRedispatchRequiredAiReviews:
              type: integer
            failedJobs:
              type: integer
        queue:
          type: object
          additionalProperties: true
    PipelineSummaryResponse:
      type: object
      properties:
        scope:
          type: object
          properties:
            eventId:
              type: string
              nullable: true
            roundId:
              type: string
              nullable: true
        queue:
          type: object
          additionalProperties: true
        webhookStatusBreakdown:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
        commitDiffStatusBreakdown:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
        aiReviewStatusBreakdown:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
    TimelineRequest:
      type: object
      required: [eventId, title]
      properties:
        eventId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        eventType:
          type: string
          enum: [WORKSHOP, CHECK_IN, ROUND, RESULT_PUBLISHING, CEREMONY, OTHER]
        status:
          type: string
          enum: [SCHEDULED, ONGOING, COMPLETED, CANCELLED]
    MediaConfigRequest:
      type: object
      required: [supabaseUrl]
      properties:
        supabaseUrl:
          type: string
          format: uri
        serviceRoleKey:
          type: string
          nullable: true
        bucket:
          type: string
        visibility:
          type: string
          enum: [private]
        maxImageSizeMb:
          type: integer
        maxVideoSizeMb:
          type: integer
        maxDocumentSizeMb:
          type: integer
        allowedImageTypes:
          type: array
          items:
            type: string
        allowedVideoTypes:
          type: array
          items:
            type: string
        allowedDocumentTypes:
          type: array
          items:
            type: string
    MediaRejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

paths:
  /health:
    get:
      summary: Liveness probe
      tags: [Runtime]
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      summary: Readiness probe
      tags: [Runtime]
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: One or more dependencies are not ready
  /api/status:
    get:
      summary: API status endpoint
      tags: [Runtime]
      responses:
        '200':
          description: API status returned
  /api/test-email:
    post:
      summary: Send a Gmail SMTP test email
      tags: [Runtime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  format: email
            example:
              to: participant@example.com
      responses:
        '200':
          description: Test email accepted by Gmail SMTP
        '503':
          description: Gmail SMTP is not configured or rejected the message

  /api/github/config:
    get:
      summary: Get GitHub integration config for an event
      description: |
        Load GitHub org configuration for a specific event.

        FE notes:
        - Use this to prefill admin settings screens.
        - The backend never returns the raw GitHub token back to the client.
      tags: [GitHub]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: eventId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GitHub config loaded
    post:
      summary: Save GitHub integration config
      description: |
        Save event-level GitHub organization settings.

        FE notes:
        - Token is stored encrypted on the backend.
        - Sending an empty `githubToken` keeps the previously saved token.
      tags: [GitHub]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubConfigRequest'
            example:
              eventId: 68452b1c4f9a72f84d8a1c10
              organizationName: seal-org
              ownerUsername: seal-admin
              githubToken: github_pat_xxx
              enabled: true
      responses:
        '200':
          description: GitHub config saved
  /api/github/config/test:
    post:
      summary: Test saved GitHub integration
      description: |
        Validate that the stored GitHub configuration can access the target organization.

        FE notes:
        - This is a good pre-flight action before enabling repository provisioning.
      tags: [GitHub]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
      responses:
        '200':
          description: Connection test completed
  /api/github/repositories:
    post:
      summary: Create a GitHub repository in the configured organization
      description: |
        Create a real GitHub repository via GitHub API.

        FE notes:
        - This is different from `/api/repositories`, which creates only the internal link record.
        - The backend also attempts webhook registration after repo creation.
      tags: [GitHub]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubRepositoryCreateRequest'
            example:
